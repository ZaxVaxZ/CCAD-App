<!-- FILE: q2-type.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question 2 — Main symptom type</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <header class="card-header">
        <h2>2. What best describes your main symptom? (choose one)</h2>
        <progress value="2" max="6" class="progress"></progress>
      </header>

      <div class="options single" data-key="symptomType">
        <label><input type="radio" name="symptom" value="pain"> Pain</label>
        <label><input type="radio" name="symptom" value="lump"> Lump or swelling</label>
        <label><input type="radio" name="symptom" value="rash"> Rash / Skin problem</label>
        <label><input type="radio" name="symptom" value="bleeding"> Bleeding / blood in stool or urine</label>
        <label><input type="radio" name="symptom" value="sob"> Shortness of breath</label>
        <label><input type="radio" name="symptom" value="cough"> Cough</label>
        <label><input type="radio" name="symptom" value="nausea"> Nausea / Vomiting</label>
        <label><input type="radio" name="symptom" value="bowel"> Change in bowel habit</label>
        <label><input type="radio" name="symptom" value="vision"> Vision problem</label>
        <label><input type="radio" name="symptom" value="dizziness"> Dizziness / fainting</label>
        <label><input type="radio" name="symptom" value="mh"> Mood / Mental health</label>
        <label><input type="radio" name="symptom" value="other"> Other</label>
      </div>

      <div class="actions">
        <a class="btn" id="back">Back</a>
        <a class="btn" id="next">Next</a>
      </div>
    </div>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
