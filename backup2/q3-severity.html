<!-- FILE: q3-severity.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question 3 — Symptom severity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <header class="card-header">
        <h2>3. How severe are your main symptoms? (0 = none, 10 = worst)</h2>
        <progress value="3" max="6" class="progress"></progress>
      </header>

      <div class="severity" data-key="severity">
        <input id="sevRange" type="range" min="0" max="10" value="5">
        <div class="sevValue">5</div>
      </div>

      <div class="actions">
        <a class="btn" id="back">Back</a>
        <a class="btn" id="next">Next</a>
      </div>
    </div>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
