<!-- FILE: page1.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Healthcare Quiz — Question 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <header class="card-header">
        <h2>Question 1</h2>
        <progress value="1" max="3" class="progress"></progress>
      </header>
      <p class="question">How often do you exercise each week?</p>
      <div class="options" data-step="1">
        <button class="option">0 times</button>
        <button class="option">1–2 times</button>
        <button class="option">3–4 times</button>
        <button class="option">5+ times</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
