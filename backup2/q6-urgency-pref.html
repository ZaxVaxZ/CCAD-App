<!-- FILE: q6-urgency-pref.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question 6 — Urgency & preference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="card">
      <header class="card-header">
        <h2>6. Is this an emergency and what do you prefer?</h2>
        <progress value="6" max="6" class="progress"></progress>
      </header>

      <div class="options single" data-key="urgency">
        <label><input type="radio" name="urgency" value="emergency"> Yes — this is an emergency (go to ER)</label>
        <label><input type="radio" name="urgency" value="urgent"> Not emergency but urgent (see within days)</label>
        <label><input type="radio" name="urgency" value="routine"> Not urgent — routine booking is fine</label>
      </div>

      <div class="options single" data-key="preference">
        <h4 style="margin-top:14px">Preference</h4>
        <label><input type="radio" name="preference" value="specialist"> Prefer to see a specialist directly</label>
        <label><input type="radio" name="preference" value="primary"> Prefer primary care first</label>
        <label><input type="radio" name="preference" value="unsure"> No preference / unsure</label>
      </div>

      <div class="actions">
        <a class="btn" id="back">Back</a>
        <a class="btn primary" id="finish">See recommendation</a>
      </div>
    </div>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
